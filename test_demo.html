<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商业地产投资分析系统 - 测试Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result-area {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status.loading {
            background: #cce5ff;
            color: #004085;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 20px;
            background: #e0e0e0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
        }
        
        .info-box h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .info-box ul {
            padding-left: 20px;
            color: #555;
        }
        
        .info-box li {
            margin-bottom: 5px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏢 商业地产投资分析系统</h1>
            <p>基于 Multi-Agent 架构的智能投资分析平台</p>
        </div>
        
        <div class="info-box">
            <h3>📋 系统功能</h3>
            <ul>
                <li>市场分析：获取商业地产行情、政策解读、地块信息</li>
                <li>收益测算：计算租金收益、回报周期、IRR/NPV</li>
                <li>风险合规：政策合规检查、风险识别、合规建议</li>
                <li>智能对话：基于 RAG 知识库的智能问答</li>
            </ul>
        </div>
        
        <div class="main-content">
            <div class="card">
                <h2>💬 智能对话</h2>
                <div class="form-group">
                    <label>输入您的问题</label>
                    <textarea id="chatInput" placeholder="例如：分析上海陆家嘴商业地产投资价值"></textarea>
                </div>
                <button class="btn" id="chatBtn" onclick="sendChat()">发送消息</button>
                <div style="margin-top: 15px;">
                    <label>响应结果：</label>
                    <div class="result-area" id="chatResult">等待发送...</div>
                </div>
            </div>
            
            <div class="card">
                <h2>📊 投资分析</h2>
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('market')">市场分析</button>
                    <button class="tab" onclick="switchTab('revenue')">收益测算</button>
                    <button class="tab" onclick="switchTab('risk')">风险合规</button>
                </div>
                
                <div id="market" class="tab-content active">
                    <div class="form-group">
                        <label>城市</label>
                        <input type="text" id="marketCity" value="上海" placeholder="输入城市名称">
                    </div>
                    <div class="form-group">
                        <label>区域</label>
                        <input type="text" id="marketArea" value="陆家嘴" placeholder="输入区域名称">
                    </div>
                    <div class="form-group">
                        <label>物业类型</label>
                        <select id="marketPropertyType">
                            <option value="写字楼">写字楼</option>
                            <option value="商铺">商铺</option>
                            <option value="公寓">公寓</option>
                        </select>
                    </div>
                    <button class="btn" onclick="analyzeMarket()">获取市场分析</button>
                </div>
                
                <div id="revenue" class="tab-content">
                    <div class="form-group">
                        <label>建筑面积（平方米）</label>
                        <input type="number" id="revenueArea" value="5000" placeholder="输入建筑面积">
                    </div>
                    <div class="form-group">
                        <label>平均租金（元/平方米/月）</label>
                        <input type="number" id="revenueRent" value="150" placeholder="输入平均租金">
                    </div>
                    <div class="form-group">
                        <label>总投资额（万元）</label>
                        <input type="number" id="revenueInvestment" value="10000" placeholder="输入总投资额">
                    </div>
                    <button class="btn" onclick="analyzeRevenue()">计算收益</button>
                </div>
                
                <div id="risk" class="tab-content">
                    <div class="form-group">
                        <label>城市</label>
                        <input type="text" id="riskCity" value="上海" placeholder="输入城市名称">
                    </div>
                    <div class="form-group">
                        <label>项目类型</label>
                        <select id="riskProjectType">
                            <option value="写字楼">写字楼</option>
                            <option value="商铺">商铺</option>
                            <option value="住宅">住宅</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>用地面积（平方米）</label>
                        <input type="number" id="riskLandArea" value="5000" placeholder="输入用地面积">
                    </div>
                    <div class="form-group">
                        <label>建筑面积（平方米）</label>
                        <input type="number" id="riskBuildingArea" value="20000" placeholder="输入建筑面积">
                    </div>
                    <button class="btn" onclick="analyzeRisk()">风险分析</button>
                </div>
                
                <div style="margin-top: 15px;">
                    <label>分析结果：</label>
                    <div class="result-area" id="analysisResult">等待分析...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }
        
        async function sendChat() {
            const input = document.getElementById('chatInput');
            const result = document.getElementById('chatResult');
            const btn = document.getElementById('chatBtn');
            
            if (!input.value.trim()) {
                result.textContent = '请输入您的问题';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '发送中...';
            result.textContent = '正在处理...';
            
            try {
                const response = await fetch(`${API_BASE}/chat/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: null,
                        message: input.value
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.textContent = JSON.stringify(data, null, 2);
                } else {
                    result.textContent = `错误: ${data.detail || '请求失败'}`;
                }
            } catch (error) {
                result.textContent = `网络错误: ${error.message}\n\n请确保：\n1. API 服务已启动 (python main.py)\n2. 端口 8000 可访问`;
            } finally {
                btn.disabled = false;
                btn.textContent = '发送消息';
            }
        }
        
        async function analyzeMarket() {
            const city = document.getElementById('marketCity').value;
            const area = document.getElementById('marketArea').value;
            const propertyType = document.getElementById('marketPropertyType').value;
            const result = document.getElementById('analysisResult');
            
            result.textContent = '正在获取市场数据...';
            
            try {
                const response = await fetch(`${API_BASE}/investment/market/${city}?area=${area}`);
                const data = await response.json();
                
                if (response.ok) {
                    result.textContent = JSON.stringify(data, null, 2);
                } else {
                    result.textContent = `错误: ${data.detail || '请求失败'}`;
                }
            } catch (error) {
                result.textContent = `网络错误: ${error.message}`;
            }
        }
        
        async function analyzeRevenue() {
            const area = document.getElementById('revenueArea').value;
            const rent = document.getElementById('revenueRent').value;
            const investment = document.getElementById('revenueInvestment').value;
            const result = document.getElementById('analysisResult');
            
            result.textContent = '正在计算收益...';
            
            try {
                const response = await fetch(`${API_BASE}/investment/revenue/calculate?area=${area}&avg_rent=${rent}&investment=${investment}`);
                const data = await response.json();
                
                if (response.ok) {
                    result.textContent = JSON.stringify(data, null, 2);
                } else {
                    result.textContent = `错误: ${data.detail || '请求失败'}`;
                }
            } catch (error) {
                result.textContent = `网络错误: ${error.message}`;
            }
        }
        
        async function analyzeRisk() {
            const city = document.getElementById('riskCity').value;
            const projectType = document.getElementById('riskProjectType').value;
            const landArea = document.getElementById('riskLandArea').value;
            const buildingArea = document.getElementById('riskBuildingArea').value;
            const result = document.getElementById('analysisResult');
            
            result.textContent = '正在分析风险...';
            
            try {
                const response = await fetch(`${API_BASE}/investment/risk/${city}?property_type=${projectType}`);
                const data = await response.json();
                
                if (response.ok) {
                    result.textContent = JSON.stringify(data, null, 2);
                } else {
                    result.textContent = `错误: ${data.detail || '请求失败'}`;
                }
            } catch (error) {
                result.textContent = `网络错误: ${error.message}`;
            }
        }
        
        // 页面加载时检查 API 连接
        window.onload = async function() {
            try {
                const response = await fetch(`${API_BASE}/health/`);
                if (response.ok) {
                    document.getElementById('chatResult').textContent = '✅ API 服务已连接，可以开始测试';
                } else {
                    document.getElementById('chatResult').textContent = '⚠️ API 服务响应异常';
                }
            } catch (error) {
                document.getElementById('chatResult').textContent = `❌ 无法连接到 API 服务\n\n请确保：\n1. API 服务已启动 (python main.py)\n2. 端口 8000 可访问\n3. 错误信息: ${error.message}`;
            }
        };
    </script>
</body>
</html>
